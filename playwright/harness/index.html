<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteThink E2E Harness</title>
    <style>
        /* Stub VS Code CSS variables so the bridge CSS resolves */
        :root {
            --vscode-editor-background: #1e1e1e;
            --vscode-editor-foreground: #d4d4d4;
            --vscode-panel-border: rgba(128, 128, 128, 0.35);
            --vscode-focusBorder: #007fd4;
            --vscode-errorForeground: #f48771;
            --vscode-gitDecoration-modifiedResourceForeground: #e2c08d;
            /* Dark+'s value, and opaque like every real theme's, so the tree's current-row band reads at the contrast a real window gives it */
            --vscode-list-inactiveSelectionBackground: #37373d;
            /* the settings drawer's selects and group chips read these, so a screenshot of the harness looks like a real window */
            --vscode-dropdown-background: #313131;
            --vscode-dropdown-border: #3c3c3c;
            --vscode-font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            font-family: var(--vscode-font-family);
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="vscode-dark">
    <div id="root"></div>
    <script>
        // Mock VS Code API
        window.__captured_messages = [];
        // back the webview persisted state with sessionStorage so getState/setState survive a
        // page reload - mirrors the real VS Code webview, which restores getState() across reloads.
        // Honour a value an addInitScript already set (test pre-seed), else restore from sessionStorage,
        // else start empty. sessionStorage is per-context, so each isolated test still boots clean.
        function loadPersistedState() {
            try {
                var raw = sessionStorage.getItem('__vsCodeState');
                if (raw) { return JSON.parse(raw); }
            } catch (e) {}
            return { docs: {} };
        }
        window.__vsCodeState = window.__vsCodeState || loadPersistedState();

        /*
         * Minimal extension host for settings.
         *
         * Since viewState stopped being a settings tier, a webview settings change has no visible
         * effect at all unless something plays the extension's part: resolve the value, then echo the
         * whole cascade back. So the harness keeps the same three layers VS Code configuration has
         * (built-in default, User, Workspace) and answers the same four messages the real PanelSession
         * answers, in the shape client/extension/src/lib/settings.ts sends: every view- and card-tree
         * setting arrives in one of two bags (`views`, `cards`), one entry per tree node, which the
         * extension assembles from one declared key per node per setting, and the five settings that
         * belong to no tree arrive as flat keys.
         *
         * FLAT_SETTINGS_DEFAULTS and CASCADE_KEY_DEFAULTS mirror FLAT_SETTINGS / CASCADE_KEY_DEFAULTS in
         * that same module. Tests may read or seed window.__nt_settings to arrange a scenario; its shape
         * is `{ user: { views, cards, <flat key>... }, workspace: { views, cards, <flat key>... } }`.
         */
        var FLAT_SETTINGS_DEFAULTS = {
            watchUnopenedFilesInViewer: true,
            openNewEditorIfNoneOpen: false,
            includeFilter: '**/*.md',
            excludeFilter: '**/{node_modules,notegit/nodejs,.git,.svn,.hg,.terraform,.claude,dist,build,out,.next,.cache,coverage,vendored}/**',
            maxNotesPerFile: 10,
        };
        var FLAT_SETTING_KEYS = Object.keys(FLAT_SETTINGS_DEFAULTS);
        var CASCADE_KEY_DEFAULTS = {
            viewType: 'auto',
            cardType: 'auto',
            showLinetagsInHeadlines: false,
            scrollNoteIntoView: true,
            autoExpandFocusedNote: false,
            showLineNumbers: false,
            groupBy: 'auto',
            orientation: 'columns',
            lineBreadth: 220,
            groupDisplay: ['untagged', 'doing', 'code-review', 'testing', 'done'].map(function(value) { return { value: value, shown: true }; }),
            groupOrder: 'custom',
            cardRatio: 1.4,
            animateTransitions: true,
            defaultCardType: 'card',
            clockMode: 'active',
        };
        window.__nt_settings = window.__nt_settings || { user: { views: {}, cards: {} }, workspace: { views: {}, cards: {} } };

        // structural comparison, so a fresh groupDisplay array (of {value, shown} entries) reads equal to the stored one
        function settingValuesEqual(a, b) {
            if (a === b) { return true; }
            if (Array.isArray(a) && Array.isArray(b)) {
                return a.length === b.length && a.every(function(item, index) { return settingValuesEqual(item, b[index]); });
            }
            if (a && b && typeof a === 'object' && typeof b === 'object') {
                var keys_a = Object.keys(a), keys_b = Object.keys(b);
                if (keys_a.length !== keys_b.length) { return false; }
                return keys_a.every(function(key) { return settingValuesEqual(a[key], b[key]); });
            }
            return false;
        }
        // a bag merges User and Workspace key by key within each node, as mergedBag() does in settings.ts
        function mergedBag(bag) {
            var user_map = window.__nt_settings.user[bag] || {};
            var workspace_map = window.__nt_settings.workspace[bag] || {};
            var merged = {};
            var node_ids = {};
            Object.keys(user_map).forEach(function(id) { node_ids[id] = true; });
            Object.keys(workspace_map).forEach(function(id) { node_ids[id] = true; });
            Object.keys(node_ids).forEach(function(id) {
                merged[id] = Object.assign({}, user_map[id] || {}, workspace_map[id] || {});
            });
            return merged;
        }
        function readFlatSetting(key) {
            var store = window.__nt_settings;
            if (store.workspace[key] !== undefined) { return store.workspace[key]; }
            if (store.user[key] !== undefined) { return store.user[key]; }
            return FLAT_SETTINGS_DEFAULTS[key];
        }
        function savedFlatDefaultOf(key) {
            var user_value = window.__nt_settings.user[key];
            return user_value === undefined ? FLAT_SETTINGS_DEFAULTS[key] : user_value;
        }
        // a cell diverges when Workspace holds it and it differs from User (or the generic default), as in settings.ts
        function bagDivergedKeys(bag) {
            var user_map = window.__nt_settings.user[bag] || {};
            var workspace_map = window.__nt_settings.workspace[bag] || {};
            var diverged = [];
            Object.keys(workspace_map).forEach(function(node_id) {
                Object.keys(workspace_map[node_id] || {}).forEach(function(key) {
                    var workspace_value = workspace_map[node_id][key];
                    var user_value = (user_map[node_id] || {})[key];
                    var baseline = user_value === undefined ? CASCADE_KEY_DEFAULTS[key] : user_value;
                    if (!settingValuesEqual(workspace_value, baseline)) { diverged.push(bag + ':' + node_id + ':' + key); }
                });
            });
            return diverged;
        }
        function buildSettingsCascadePayload() {
            var store = window.__nt_settings;
            var payload = { views: mergedBag('views'), cards: mergedBag('cards') };
            var diverged = [];
            var has_workspace_overrides = Object.keys(store.workspace.views || {}).length > 0 || Object.keys(store.workspace.cards || {}).length > 0;
            var has_any_overrides = has_workspace_overrides || Object.keys(store.user.views || {}).length > 0 || Object.keys(store.user.cards || {}).length > 0;
            FLAT_SETTING_KEYS.forEach(function(key) {
                payload[key] = readFlatSetting(key);
                if (!settingValuesEqual(payload[key], savedFlatDefaultOf(key))) { diverged.push(key); }
                if (store.workspace[key] !== undefined) { has_workspace_overrides = true; }
                if (store.workspace[key] !== undefined || store.user[key] !== undefined) { has_any_overrides = true; }
            });
            diverged = diverged.concat(bagDivergedKeys('views')).concat(bagDivergedKeys('cards'));
            payload.diverged = diverged;
            payload.hasWorkspaceOverrides = has_workspace_overrides;
            payload.hasAnyOverrides = has_any_overrides;
            return payload;
        }
        // deferred so the echo never lands inside the React render that posted the message
        function sendSettingsCascade() {
            var payload = buildSettingsCascadePayload();
            setTimeout(function() {
                window.dispatchEvent(new MessageEvent('message', {
                    data: { type: 'settingsCascade', settings: payload },
                }));
            }, 0);
        }
        // test hook: re-publish after a spec seeds __nt_settings, as a reopened diverged window arrives
        window.__nt_publishSettings = sendSettingsCascade;
        function writeFlatSetting(key, value, scope) {
            var layer = scope === 'global' ? window.__nt_settings.user : window.__nt_settings.workspace;
            if (value === undefined) { delete layer[key]; } else { layer[key] = value; }
        }
        /*
         * The one bag write path: every cell op in `sets` ({node_id, key, value}) applies together
         * against the target scope's own copy of the bag, standing in for applyBagDelta() in
         * settings.ts. `key === null` operates on the whole node entry: undefined deletes it (removing
         * a saved type, and every descendant doomed with it), any other value replaces it wholesale
         * (minting a saved type's complete entry). `key` set clears or sets one field, pruning the
         * node's entry once it holds nothing at all.
         */
        function applyBagDelta(bag, sets, scope) {
            var layer = scope === 'global' ? window.__nt_settings.user : window.__nt_settings.workspace;
            var current = layer[bag] || {};
            var next = Object.assign({}, current);
            sets.forEach(function(op) {
                if (!op || typeof op.node_id !== 'string') { return; }
                if (op.key === null) {
                    if (op.value === undefined) { delete next[op.node_id]; } else { next[op.node_id] = op.value; }
                    return;
                }
                var entry = Object.assign({}, next[op.node_id] || {});
                if (op.value === undefined) { delete entry[op.key]; } else { entry[op.key] = op.value; }
                if (Object.keys(entry).length === 0) { delete next[op.node_id]; } else { next[op.node_id] = entry; }
            });
            layer[bag] = next;
        }
        function handleSettingsMessage(msg) {
            var store = window.__nt_settings;
            switch (msg && msg.type) {
                case 'requestInitialState':
                    sendSettingsCascade();
                    return;
                case 'updateSetting':
                    if (msg.setting === 'views' || msg.setting === 'cards') {
                        applyBagDelta(msg.setting, (msg.value || {}).sets || [], msg.scope);
                        sendSettingsCascade();
                        return;
                    }
                    if (!(msg.setting in FLAT_SETTINGS_DEFAULTS)) { return; }
                    writeFlatSetting(msg.setting, msg.value, msg.scope);
                    sendSettingsCascade();
                    return;
                case 'promoteSettingsToUser':
                    // snapshot each bag's merged result, and every flat key's resolved value, into User; drop the Workspace layer
                    store.user.views = mergedBag('views');
                    store.user.cards = mergedBag('cards');
                    FLAT_SETTING_KEYS.forEach(function(key) { store.user[key] = readFlatSetting(key); });
                    store.workspace = { views: {}, cards: {} };
                    sendSettingsCascade();
                    return;
                case 'resetSettingsToDefault':
                    store.workspace = { views: {}, cards: {} };
                    sendSettingsCascade();
                    return;
                case 'restoreSettingsToBuiltinDefault':
                    store.workspace = { views: {}, cards: {} };
                    store.user = { views: {}, cards: {} };
                    sendSettingsCascade();
                    return;
            }
        }

        window.acquireVsCodeApi = function() {
            return {
                getState: function() { return window.__vsCodeState; },
                setState: function(s) {
                    window.__vsCodeState = s;
                    try { sessionStorage.setItem('__vsCodeState', JSON.stringify(s)); } catch (e) {}
                },
                postMessage: function(msg) {
                    window.__captured_messages.push(msg);
                    handleSettingsMessage(msg);
                },
            };
        };
        // Required shim for webpack commonjs output
        var exports = {};
    </script>
    <script src="/client/webview/dist/index.js"></script>
</body>
</html>
