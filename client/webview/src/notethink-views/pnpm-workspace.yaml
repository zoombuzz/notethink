# This directory is its own install root with its own pnpm-lock.yaml, and this file is what keeps it
# that way. The repo root carries a pnpm-workspace.yaml too, so without one here `pnpm install` would
# walk up, find the root's, install the ROOT project instead of this one and re-run the root
# postinstall - which installs this directory again, unbounded. pnpm stops the upward walk at the
# nearest workspace file, so this one ends it here.
#
# allowBuilds is the only build-approval key pnpm 11 reads. Both entries are false because neither
# build script has ever run in this repo: under pnpm 10 no approval key existed, so every build was
# skipped and lint and jest have been green that way for many waves. On linux-x64-gnu each resolves a
# prebuilt optional dependency and the build script is only a fallback. pnpm 11 turns an unapproved
# build script into a hard error rather than a warning, so the existing behaviour now has to be stated
# rather than left implicit. Flip one to true if a platform without a prebuild ever needs it.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
